<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ÉLORA | الورا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--iv:#F7F4EF;--sa:#EFEAE2;--ch:#1C1B19;--go:#B08D57;--es:#2A2622;--bo:#7A2E2E;--tx:#6B655C;--ln:#e0d8ca;--bg:var(--iv);--card:#fbf9f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1C1B19;--card:#2A2622;--sa:#2f2a25;--ln:#453d33;--tx:#c9c0b2;--ch:#F7F4EF;--iv:#1C1B19}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}h1,h2,h3{color:var(--ch);margin:0;font-weight:600}
.w{max-width:1200px;margin:0 auto;padding:0 20px}.logo{font-family:'Cormorant Garamond',serif;letter-spacing:.3em;color:var(--ch);font-size:26px;direction:ltr}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:14px 16px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.bar{max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--ln);border-radius:40px;height:64px;display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;padding:0 24px;box-shadow:0 4px 18px #0000000d;position:relative}
.nav{display:flex;gap:22px;font-size:14px;color:var(--ch)}.nav a.on{color:var(--go);font-weight:600}
.notch{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:150px;height:92px;background:var(--card);border:1px solid var(--ln);border-top:0;border-radius:0 0 50% 50%/0 0 60% 60%;text-align:center;padding-top:20px}
.notch svg{display:block;margin:0 auto 2px}.ic{display:flex;gap:6px;justify-content:flex-start}.ic button{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;color:var(--ch)}
.bd{position:absolute;top:-4px;right:-4px;background:var(--bo);color:#fff;font-size:10px;border-radius:9px;min-width:17px;line-height:17px;text-align:center}
.sub{max-width:1100px;margin:8px auto 0;display:flex;gap:26px;justify-content:center;font-size:13px;padding:8px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--ln)}.sub a:hover{color:var(--go)}
.burger{display:none}.btn{background:var(--ch);color:var(--bg);padding:12px 26px;border-radius:30px;font-size:14px;display:inline-flex;gap:8px;align-items:center}.btn.go{background:var(--go);color:#fff}.btn.o{background:none;border:1px solid var(--ch);color:var(--ch)}
.hero{margin-top:22px;border-radius:24px;overflow:hidden;position:relative;min-height:440px;background:var(--ch)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left}
.hero .t{position:relative;padding:90px 50px;color:#fff;max-width:520px;margin-inline-start:auto;background:linear-gradient(270deg,#1c1b19b0,transparent)}.hero h1{color:#fff;font-size:46px;line-height:1.3}.hero p{margin:16px 0 26px;color:#eee}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.cat{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--ln);text-align:center}.cat img{width:100%;height:210px;object-fit:cover;display:block;transition:.4s}.cat:hover img{transform:scale(1.05)}.cat div{padding:10px;color:var(--ch);font-weight:600;position:relative;background:var(--card)}
.sec{margin:46px 0 20px;text-align:center;font-size:24px;display:flex;align-items:center;gap:16px}.sec:before,.sec:after{content:"";flex:1;border-top:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.pc{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;position:relative}
.pc .im{aspect-ratio:3/4;overflow:hidden;display:block;position:relative}.pc img{width:100%;height:100%;object-fit:cover;transition:.4s}.pc:hover img{transform:scale(1.05)}
.pc .b{padding:12px 14px 14px;text-align:center}.pc h3{font-size:14px}.pr{color:var(--ch);font-weight:600;margin-top:4px}.pr s{color:var(--tx);font-weight:300;font-size:12px;margin-inline-end:8px}
.tag{position:absolute;top:10px;right:10px;background:var(--bo);color:#fff;font-size:11px;padding:1px 10px;border-radius:12px}.hb{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:#fbf9f5e6;display:grid;place-items:center;color:var(--ch)}.hb.on{color:var(--bo)}
.ac{display:flex;gap:6px;margin-top:10px}.ac button{flex:1;padding:7px;border-radius:20px;font-size:12px;border:1px solid var(--ln);color:var(--ch)}.ac button.p{background:var(--ch);color:var(--bg)}
.story{background:var(--es);color:#e8e0d2;border-radius:24px;padding:50px;margin:50px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.story h2{color:#fff;font-size:28px}
.shop{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:20px}.fl{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;align-self:start;position:sticky;top:170px;max-height:calc(100vh - 190px);overflow:auto}.fl h4{margin:14px 0 6px;color:var(--ch);font-size:14px}.fl label{display:inline-flex;gap:5px;align-items:center;margin:2px 0;width:48%;font-size:13px;cursor:pointer}.fl input{accent-color:var(--go)}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}select,input.s{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;font:inherit;color:var(--ch)}.chip{background:var(--sa);border-radius:16px;padding:2px 12px;font-size:12px;color:var(--ch);display:inline-flex;gap:4px}
.fbtn{display:none}.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;margin-top:26px}.gal{display:grid;grid-template-columns:1fr 70px;gap:10px}.mainimg{border-radius:18px;overflow:hidden;aspect-ratio:3/4;cursor:zoom-in;background:var(--sa)}.mainimg img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.th{display:flex;flex-direction:column;gap:8px}.th img{width:70px;height:88px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.6}.th img.on{opacity:1;outline:2px solid var(--go)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:inline-block;margin-inline-end:6px}.qty{display:inline-flex;border:1px solid var(--ln);border-radius:22px;align-items:center}.qty button{width:36px;height:38px}.qty b{min-width:30px;text-align:center;color:var(--ch)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--ln);margin-top:40px}.tabs button{padding:10px 0;color:var(--tx)}.tabs button.on{color:var(--ch);border-bottom:2px solid var(--go)}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid var(--ln)}
.ov{position:fixed;inset:0;background:#0007;z-index:50}.dr{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--bg);z-index:51;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:10px}.ci img{width:56px;height:70px;object-fit:cover;border-radius:8px}
.fd{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:30px;max-width:760px;margin:30px auto;text-align:center}.op{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}.op button{padding:9px 20px;border:1px solid var(--ln);border-radius:24px;color:var(--ch)}.op button:hover,.op button.on{background:var(--ch);color:var(--bg)}
.nl{background:var(--sa);border-radius:24px;padding:40px;text-align:center;margin:40px 0}footer{background:var(--es);color:#cfc6b6;margin-top:60px;padding:40px 0;font-size:14px}footer .w{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}footer .logo{color:#fff}
@media(max-width:860px){.bar{grid-template-columns:auto 1fr auto;padding:0 14px}.bar .nav{display:none}.burger{display:grid}.notch{position:static;transform:none;width:auto;height:auto;border:0;background:none;padding:0}.notch svg{display:none}.cats{grid-template-columns:1fr 1fr}.hero .t{padding:60px 24px}.hero h1{font-size:32px}.shop,.pd{grid-template-columns:1fr}.fl{display:none;position:fixed;inset:0 auto 0 0;width:300px;max-width:90vw;z-index:51;max-height:none;border-radius:0}.fl.open{display:block}.fbtn{display:inline-flex}.gal{grid-template-columns:1fr}.th{flex-direction:row;order:2}}
</style></head><body><div id="r"></div>

<footer id="ft"><div class="w"><div><div class="logo">ÉLORA</div><p>زیبایی در ظرافت پوشش<br/>Modest Fashion · Scarf Collection</p></div><div><b style="color:#fff">درباره ما</b><p>برند ایرانی روسری و پوشش اسلامی با تمرکز بر کیفیت و ظرافت.</p></div><div><b style="color:#fff">راهنمای خرید</b><p>ارسال سریع، پرداخت امن و ضمانت بازگشت ۷ روزه.</p></div><div><b style="color:#fff">تماس با ما</b><p>info@elora.example · ۰۲۱-۱۲۳۴۵۶۷۸</p></div></div></footer>
${dr=='cart'&&h`<${Drawer} title="سبد خرید" onClose=${()=>setDr(null)}>${ids.length?h`${ids.map(k=>{const p=P.find(x=>x.id==k);return h`<div class="ci" key=${k}><img src=${p.img} alt=""/><div style="flex:1"><div style="color:var(--ch);font-size:14px">${p.name}</div><div>${T(p.price)}</div><div class="qty"><button onClick=${()=>setCart(c=>({...c,[k]:c[k]-1}))}>−</button><b>${fa(cart[k])}</b><button onClick=${()=>setCart(c=>({...c,[k]:c[k]+1}))}>+</button></div></div><button onClick=${()=>setCart(c=>({...c,[k]:0}))}><${Ic} d=${I.x} s=${16}/></button></div>`})}<b style="color:var(--ch)">مجموع: ${T(total)}</b><button class="btn" onClick=${()=>{setCart({});setDr(null);setMsg('سفارش شما ثبت شد (نمونه)')}}>ادامه خرید</button>`:h`<p>سبد خرید شما خالی است.</p>`}</${Drawer}>`}
${dr=='wish'&&h`<${Drawer} title="علاقه‌مندی‌ها" onClose=${()=>setDr(null)}>${wish.length?wish.map(id=>{const p=P.find(x=>x.id==id);return h`<div class="ci" key=${id}><img src=${p.img} alt=""/><div style="flex:1"><a onClick=${()=>{setDr(null);go('product-'+id)}}>${p.name}</a><div>${T(p.price)}</div></div><button class="btn" onClick=${()=>add(id,1)}>سبد</button><button onClick=${()=>toggleW(id)}><${Ic} d=${I.x} s=${16}/></button></div>`}):h`<p>هنوز چیزی اضافه نکرده‌اید.</p>`}</${Drawer}>`}
${qv&&h`<${Drawer} title=${qv.name} onClose=${()=>setQv(null)}><img src=${qv.img} style="width:100%;border-radius:14px" alt=""/><div class="pr">${T(qv.price)}</div><p>${qv.fab} · ${qv.size} · ${qv.col}</p><button class="btn" onClick=${()=>{add(qv.id,1);setQv(null)}}>افزودن به سبد</button><button class="btn o" onClick=${()=>{setQv(null);go('product-'+qv.id)}}>جزئیات کامل</button></${Drawer}>`}
${msg&&h`<div class="ov" onClick=${()=>setMsg('')} style="display:grid;place-items:center"><div class="fd" style="margin:0">${msg}</div></div>`}</div>`}
