<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ÉLORA | الورا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--iv:#F7F4EF;--sa:#EFEAE2;--ch:#1C1B19;--go:#B08D57;--es:#2A2622;--bo:#7A2E2E;--tx:#6B655C;--ln:#e0d8ca;--bg:var(--iv);--card:#fbf9f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1C1B19;--card:#2A2622;--sa:#2f2a25;--ln:#453d33;--tx:#c9c0b2;--ch:#F7F4EF;--iv:#1C1B19}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}h1,h2,h3{color:var(--ch);margin:0;font-weight:600}
.w{max-width:1200px;margin:0 auto;padding:0 20px}.logo{font-family:'Cormorant Garamond',serif;letter-spacing:.3em;color:var(--ch);font-size:26px;direction:ltr}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:14px 16px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.bar{max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--ln);border-radius:40px;height:64px;display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;padding:0 24px;box-shadow:0 4px 18px #0000000d;position:relative}
.nav{display:flex;gap:22px;font-size:14px;color:var(--ch)}.nav a.on{color:var(--go);font-weight:600}
.notch{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:150px;height:92px;background:var(--card);border:1px solid var(--ln);border-top:0;border-radius:0 0 50% 50%/0 0 60% 60%;text-align:center;padding-top:20px}
.notch svg{display:block;margin:0 auto 2px}.ic{display:flex;gap:6px;justify-content:flex-start}.ic button{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;color:var(--ch)}
.bd{position:absolute;top:-4px;right:-4px;background:var(--bo);color:#fff;font-size:10px;border-radius:9px;min-width:17px;line-height:17px;text-align:center}
.sub{max-width:1100px;margin:8px auto 0;display:flex;gap:26px;justify-content:center;font-size:13px;padding:8px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--ln)}.sub a:hover{color:var(--go)}
.burger{display:none}.btn{background:var(--ch);color:var(--bg);padding:12px 26px;border-radius:30px;font-size:14px;display:inline-flex;gap:8px;align-items:center}.btn.go{background:var(--go);color:#fff}.btn.o{background:none;border:1px solid var(--ch);color:var(--ch)}
.hero{margin-top:22px;border-radius:24px;overflow:hidden;position:relative;min-height:440px;background:var(--ch)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left}
.hero .t{position:relative;padding:90px 50px;color:#fff;max-width:520px;margin-inline-start:auto;background:linear-gradient(270deg,#1c1b19b0,transparent)}.hero h1{color:#fff;font-size:46px;line-height:1.3}.hero p{margin:16px 0 26px;color:#eee}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.cat{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--ln);text-align:center}.cat img{width:100%;height:210px;object-fit:cover;display:block;transition:.4s}.cat:hover img{transform:scale(1.05)}.cat div{padding:10px;color:var(--ch);font-weight:600;position:relative;background:var(--card)}
.sec{margin:46px 0 20px;text-align:center;font-size:24px;display:flex;align-items:center;gap:16px}.sec:before,.sec:after{content:"";flex:1;border-top:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.pc{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;position:relative}
.pc .im{aspect-ratio:3/4;overflow:hidden;display:block;position:relative}.pc img{width:100%;height:100%;object-fit:cover;transition:.4s}.pc:hover img{transform:scale(1.05)}
.pc .b{padding:12px 14px 14px;text-align:center}.pc h3{font-size:14px}.pr{color:var(--ch);font-weight:600;margin-top:4px}.pr s{color:var(--tx);font-weight:300;font-size:12px;margin-inline-end:8px}
.tag{position:absolute;top:10px;right:10px;background:var(--bo);color:#fff;font-size:11px;padding:1px 10px;border-radius:12px}.hb{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:#fbf9f5e6;display:grid;place-items:center;color:var(--ch)}.hb.on{color:var(--bo)}
.ac{display:flex;gap:6px;margin-top:10px}.ac button{flex:1;padding:7px;border-radius:20px;font-size:12px;border:1px solid var(--ln);color:var(--ch)}.ac button.p{background:var(--ch);color:var(--bg)}
.story{background:var(--es);color:#e8e0d2;border-radius:24px;padding:50px;margin:50px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.story h2{color:#fff;font-size:28px}
.shop{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:20px}.fl{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;align-self:start;position:sticky;top:170px;max-height:calc(100vh - 190px);overflow:auto}.fl h4{margin:14px 0 6px;color:var(--ch);font-size:14px}.fl label{display:inline-flex;gap:5px;align-items:center;margin:2px 0;width:48%;font-size:13px;cursor:pointer}.fl input{accent-color:var(--go)}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}select,input.s{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;font:inherit;color:var(--ch)}.chip{background:var(--sa);border-radius:16px;padding:2px 12px;font-size:12px;color:var(--ch);display:inline-flex;gap:4px}
.fbtn{display:none}.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;margin-top:26px}.gal{display:grid;grid-template-columns:1fr 70px;gap:10px}.mainimg{border-radius:18px;overflow:hidden;aspect-ratio:3/4;cursor:zoom-in;background:var(--sa)}.mainimg img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.th{display:flex;flex-direction:column;gap:8px}.th img{width:70px;height:88px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.6}.th img.on{opacity:1;outline:2px solid var(--go)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:inline-block;margin-inline-end:6px}.qty{display:inline-flex;border:1px solid var(--ln);border-radius:22px;align-items:center}.qty button{width:36px;height:38px}.qty b{min-width:30px;text-align:center;color:var(--ch)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--ln);margin-top:40px}.tabs button{padding:10px 0;color:var(--tx)}.tabs button.on{color:var(--ch);border-bottom:2px solid var(--go)}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid var(--ln)}
.ov{position:fixed;inset:0;background:#0007;z-index:50}.dr{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--bg);z-index:51;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:10px}.ci img{width:56px;height:70px;object-fit:cover;border-radius:8px}
.fd{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:30px;max-width:760px;margin:30px auto;text-align:center}.op{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}.op button{padding:9px 20px;border:1px solid var(--ln);border-radius:24px;color:var(--ch)}.op button:hover,.op button.on{background:var(--ch);color:var(--bg)}
.nl{background:var(--sa);border-radius:24px;padding:40px;text-align:center;margin:40px 0}footer{background:var(--es);color:#cfc6b6;margin-top:60px;padding:40px 0;font-size:14px}footer .w{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}footer .logo{color:#fff}
@media(max-width:860px){.bar{grid-template-columns:auto 1fr auto;padding:0 14px}.bar .nav{display:none}.burger{display:grid}.notch{position:static;transform:none;width:auto;height:auto;border:0;background:none;padding:0}.notch svg{display:none}.cats{grid-template-columns:1fr 1fr}.hero .t{padding:60px 24px}.hero h1{font-size:32px}.shop,.pd{grid-template-columns:1fr}.fl{display:none;position:fixed;inset:0 auto 0 0;width:300px;max-width:90vw;z-index:51;max-height:none;border-radius:0}.fl.open{display:block}.fbtn{display:inline-flex}.gal{grid-template-columns:1fr}.th{flex-direction:row;order:2}}
</style></head><body><div id="r"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const IMG=__IMGS__;const{useState,useEffect,useMemo}=React;const h=htm.bind(React.createElement);
const fa=n=>Number(n).toLocaleString('fa-IR');const T=n=>fa(n)+' تومان';
// ---- data layer (swap for WooCommerce REST later) ----
const COL={'کرم':'#E8DCC8','مشکی':'#1C1B19','سرمه‌ای':'#1F2A4D','زرشکی':'#7A2E2E','سبز زیتونی':'#5B6139','قهوه‌ای':'#6B4A33','طوسی':'#8D8D8D','صورتی':'#D9A9A4'};
const P=[
[1,'روسری ابریشمی طرح گلستان',2980000,0,'مجلسی','متوسط','ابریشم','کرم','گلدار','بهار','متوسط','shop-cream'],
[2,'روسری ترمه زرشکی',3280000,3680000,'مجلسی','بزرگ','ترمه','زرشکی','سنتی','زمستان','زیاد','shop-bordeaux'],
[3,'روسری نخ ساده زیتونی',1480000,0,'روزمره','متوسط','نخ','سبز زیتونی','ساده','چهارفصل','زیاد','flat-olive'],
[4,'روسری کرپ سرمه‌ای',2480000,0,'رسمی','بزرگ','کرپ','سرمه‌ای','ساده','پاییز','زیاد','shop-navy'],
[5,'روسری ابریشم طرح سنتی',3480000,0,'رسمی','متوسط','ابریشم','کرم','سنتی','بهار','متوسط','flat-beige'],
[6,'روسری مجلسی بژ',2780000,0,'مجلسی','بزرگ','ساتن','کرم','گلدار','تابستان','کم','cat-paisley'],
[7,'روسری ساتن قهوه‌ای',2180000,2480000,'مجلسی','متوسط','ساتن','قهوه‌ای','ساده','پاییز','کم','cat-tan'],
[8,'روسری چهار فصل طوسی',1680000,0,'روزمره','کوچک','نخ','طوسی','هندسی','چهارفصل','متوسط','cat-navy'],
[9,'روسری گلدار کرم و سرمه‌ای',2280000,2680000,'روزمره','متوسط','کرپ','سرمه‌ای','گلدار','بهار','متوسط','flat-blue'],
[10,'روسری پشمی زمستانی',2980000,0,'روزمره','بزرگ','پشم و موهر','قهوه‌ای','ساده','زمستان','زیاد','hero'],
[11,'روسری مینیمال مشکی',1580000,0,'رسمی','متوسط','کرپ','مشکی','ساده','چهارفصل','زیاد','cat-olive'],
[12,'روسری ترمه سبز یشمی',3180000,0,'مجلسی','بزرگ','ترمه','سبز زیتونی','سنتی','پاییز','زیاد','shop-green']
].map(a=>({id:a[0],name:a[1],price:a[2],old:a[3],use:a[4],size:a[5],fab:a[6],col:a[7],pat:a[8],sea:a[9],cov:a[10],img:IMG[a[11]],rating:4.5+(a[0]%5)/10,n:8+a[0]*3}));
const GAL=p=>p.id==1?[IMG['detail-main'],IMG['detail-fabric'],p.img]:[p.img,IMG['detail-fabric']];
const FL=[['use','نوع استفاده',['روزمره','رسمی','مجلسی']],['size','قواره',['کوچک','متوسط','بزرگ']],['fab','جنس',['ابریشم','نخ','کرپ','ترمه','ساتن','پشم و موهر']],['col','رنگ',Object.keys(COL)],['pat','طرح',['ساده','گلدار','سنتی','هندسی']],['sea','فصل',['بهار','تابستان','پاییز','زمستان','چهارفصل']],['cov','میزان پوشانندگی',['کم','متوسط','زیاد']]];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const Ic=({d,s=18,f})=>h`<svg width=${s} height=${s} viewBox="0 0 24 24" fill=${f||'none'} stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML=${{__html:d}}/>`;
const I={search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',heart:'<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',check:'<path d="M20 6 9 17l-5-5"/>'};
const Lotus=()=>h`<svg width="34" height="24" viewBox="0 0 34 24" fill="none" stroke="#B08D57" stroke-width="1.1"><path d="M17 22C13 17 13 8 17 2c4 6 4 15 0 20zM17 22C10 21 5 15 4 9c6 1 11 6 13 13zM17 22c7-1 12-7 13-13-6 1-11 6-13 13z"/></svg>`;
const go=x=>{location.hash=x};
function Header({cart,wish,route,openCart,openWish,q,setQ}){const[m,setM]=useState(false),[se,setSe]=useState(false);
const nv=[['home','صفحه اصلی'],['shop','فروشگاه'],['about','درباره ما'],['guide','راهنمای خرید'],['contact','تماس با ما']];
const sb=[['روزمره','روسری روزمره'],['رسمی','روسری رسمی'],['مجلسی','روسری مجلسی'],['ابریشم','روسری ابریشمی'],['ترمه','روسری ترمه'],['new','جدیدترین‌ها']];
const nav=(a)=>h`${nv.map(([k,t])=>h`<a key=${k} class=${route==k?'on':''} onClick=${()=>{setM(false);['about','guide','contact'].includes(k)?document.getElementById('ft').scrollIntoView({behavior:'smooth'}):go(k)}}>${t}</a>`)}`;
return h`<header><div class="bar"><nav class="nav">${nav()}</nav><div class="notch"><${Lotus}/><a class="logo" onClick=${()=>go('home')}>ÉLORA</a></div>
<div class="ic"><button class="burger" onClick=${()=>setM(!m)}><${Ic} d=${I.menu}/></button><button onClick=${openCart}><${Ic} d=${I.bag}/>${cart>0&&h`<span class="bd">${fa(cart)}</span>`}</button><button onClick=${openWish}><${Ic} d=${I.heart}/>${wish>0&&h`<span class="bd">${fa(wish)}</span>`}</button><button onClick=${()=>setSe(!se)}><${Ic} d=${I.search}/></button><button onClick=${()=>alert('ورود / ثبت‌نام به‌زودی با WooCommerce فعال می‌شود')}><${Ic} d=${I.user}/></button></div></div>
${se&&h`<div style="text-align:center;margin-top:8px"><input class="s" autofocus placeholder="جستجوی روسری..." value=${q} onInput=${e=>{setQ(e.target.value);go('shop')}} style="width:min(420px,90%)"/></div>`}
${m&&h`<div class="sub" style="flex-direction:column;gap:10px;background:var(--card);border-radius:20px">${nav()}</div>`}
<div class="sub">${sb.map(([k,t])=>h`<a key=${k} onClick=${()=>go('shop'+(k=='new'?'':'-'+encodeURIComponent(k).replace(/%/g,'')))}>${t}</a>`)}<a onClick=${()=>go('finder')} style="color:var(--go)">✦ روسری مناسب من</a></div></header>`}
function Card({p,wish,toggleW,add,quick}){const w=wish.includes(p.id);return h`<div class="pc"><a class="im" onClick=${()=>go('product-'+p.id)}><img src=${p.img} alt=${p.name} loading="lazy"/>${p.old>0&&h`<span class="tag">تخفیف</span>`}</a>
<button class=${'hb '+(w?'on':'')} onClick=${()=>toggleW(p.id)} aria-label="علاقه‌مندی"><${Ic} d=${I.heart} s=${16} f=${w?'currentColor':'none'}/></button>
<div class="b"><h3>${p.name}</h3><div class="pr">${p.old>0&&h`<s>${fa(p.old)}</s>`}${T(p.price)}</div><div class="ac"><button onClick=${()=>quick(p)}>مشاهده سریع</button><button class="p" onClick=${()=>add(p.id,1)}>افزودن به سبد</button></div></div></div>`}
const Grid=(pr)=>h`<div class="grid">${pr.items.map(p=>h`<${Card} key=${p.id} p=${p} ...${pr}/>`)}</div>`;
function Home(pr){const C=[['روزمره','cat-tan','روزمره'],['رسمی','cat-navy','رسمی'],['مجلسی','cat-paisley','مجلسی'],['ترمه و ابریشم','cat-olive','ترمه']];
return h`<div class="w"><section class="hero"><img src=${IMG.hero} alt=""/><div class="t"><h1>زیبایی در ظرافت پوشش</h1><p>مجموعه‌ای از روسری‌های خاص و ماندگار برای استایل پوشیده و شیک شما</p><a class="btn go" onClick=${()=>go('shop')}>مشاهده مجموعه ←</a></div></section>
<div class="cats">${C.map(([t,i,k])=>h`<a class="cat" key=${t} onClick=${()=>go('shop-'+k)}><img src=${IMG[i]} alt=${t}/><div>${t}</div></a>`)}</div>
<h2 class="sec">پرفروش‌ترین‌ها</h2><${Grid} ...${pr} items=${P.slice(0,4)}/>
<h2 class="sec">جدیدترین‌ها</h2><${Grid} ...${pr} items=${P.slice(8,12)}/>
<div class="story"><div><h2>راز زیبایی، در انتخاب درست است...</h2><p>روسری بخش اصلی استایل پوشیده است، نه یک اکسسوری صرف.</p></div><a class="btn go" onClick=${()=>go('finder')}>راهنمای انتخاب روسری</a></div>
<${News}/></div>`}
function News(){const[d,setD]=useState(0);return h`<div class="nl"><h2>عضویت در خبرنامه</h2><p>از مجموعه‌های جدید و تخفیف‌ها زودتر باخبر شوید.</p>${d?h`<p style="color:var(--go)">✓ ثبت شد. ممنون!</p>`:h`<div onKeyDown=${()=>0}><input class="s" id="em" placeholder="ایمیل شما" style="width:min(300px,70%)"/> <button class="btn" onClick=${()=>document.getElementById('em').value.includes('@')?setD(1):alert('ایمیل معتبر وارد کنید')}>عضویت</button></div>`}</div>`}
function Shop(pr){const{q,pre}=pr;const[f,setF]=useState({});const[sort,setSort]=useState('new');const[op,setOp]=useState(false);
useEffect(()=>{setF(pre?{[pre[0]]:[pre[1]]}:{})},[pre&&pre.join()]);
const tog=(k,v)=>setF(o=>{const a=o[k]||[];return{...o,[k]:a.includes(v)?a.filter(x=>x!=v):[...a,v]}});
const items=useMemo(()=>{let r=P.filter(p=>FL.every(([k])=>!(f[k]&&f[k].length)||f[k].includes(p[k])||(k=='sea'&&p.sea=='چهارفصل')));if(q)r=r.filter(p=>(p.name+p.fab+p.col+p.pat+p.use).includes(q));
return [...r].sort((a,b)=>sort=='lo'?a.price-b.price:sort=='hi'?b.price-a.price:sort=='dis'?(b.old>0)-(a.old>0):b.id-a.id)},[f,sort,q]);
const act=FL.flatMap(([k,,]=[])=>(f[k]||[]).map(v=>[k,v]));
return h`<div class="w"><h1 style="margin-top:24px">فروشگاه</h1><div class="shop"><aside class=${'fl '+(op?'open':'')}><div style="display:flex;justify-content:space-between"><b style="color:var(--ch)">فیلترها</b><button onClick=${()=>setOp(false)} class="fbtn" style="display:none"></button><button onClick=${()=>setOp(false)}>${op?'بستن ✕':''}</button></div>
${FL.map(([k,t,o])=>h`<div key=${k}><h4>${t}</h4>${k=='col'?h`<div>${o.map(v=>h`<span key=${v} title=${v} class="sw" onClick=${()=>tog(k,v)} style=${{background:COL[v],cursor:'pointer',outlineOffset:2,outline:(f[k]||[]).includes(v)?'2px solid #B08D57':'none'}}></span>`)}</div>`:o.map(v=>h`<label key=${v}><input type="checkbox" checked=${(f[k]||[]).includes(v)} onChange=${()=>tog(k,v)}/>${v}</label>`)}</div>`)}</aside>

function Product({id,wish,toggleW,add,...pr}){const p=P.find(x=>x.id==id);const[i,setI]=useState(0),[qt,setQ]=useState(1),[z,setZ]=useState(null),[tab,setTab]=useState(0);useEffect(()=>{setI(0);setQ(1)},[id]);

<div><h1>${p.name}</h1><div style="color:var(--go)">${'★'.repeat(5)} <span style="color:var(--tx);font-size:13px">(${fa(p.n)} نظر)</span></div><div class="pr" style="font-size:26px;margin:10px 0">${p.old>0&&h`<s>${fa(p.old)}</s>`}${T(p.price)}</div>
<p>رنگ: <span class="sw" style=${{background:COL[p.col]}}></span>${p.col}</p><p>جنس: ${p.fab} · قواره: ${p.size} · ابعاد: ${p.size=='بزرگ'?'۱۶۰×۱۶۰':p.size=='متوسط'?'۱۳۰×۱۳۰':'۹۰×۹۰'} سانتی‌متر</p><p style="color:#4b7a4b">✓ موجود در انبار</p>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px"><div class="qty"><button onClick=${()=>setQ(Math.max(1,qt-1))}>−</button><b>${fa(qt)}</b><button onClick=${()=>setQ(qt+1)}>+</button></div><button class="btn" onClick=${()=>add(p.id,qt)}>افزودن به سبد خرید</button><button class="btn o" onClick=${()=>toggleW(p.id)}>${w?'♥ در علاقه‌مندی‌ها':'♡ افزودن به علاقه‌مندی'}</button></div><p style="font-size:13px">ارسال سریع · ضمانت بازگشت ۷ روزه</p></div></div>
<div class="tabs">${['توضیحات','مشخصات فنی','نظرات کاربران'].map((t,k)=>h`<button key=${k} class=${tab==k?'on':''} onClick=${()=>setTab(k)}>${t}</button>`)}</div><div style="padding:16px 0">${tab==0?h`<p>${p.name} با بافتی نرم و ریزش زیبا، مناسب استفاده ${p.use}. طراحی ${p.pat} و رنگ ${p.col} با استایل پوشیده شما هماهنگ است.</p>`:tab==1?h`<table><tbody>${[['جنس',p.fab],['قواره',p.size],['طرح',p.pat],['فصل',p.sea],['پوشانندگی',p.cov],['نوع استفاده',p.use]].map(([a,b])=>h`<tr key=${a}><td>${a}</td><td>${b}</td></tr>`)}</tbody></table>`:h`<p>«کیفیت پارچه عالی و رنگ دقیقاً مثل عکس بود.» — مریم ر.</p><p>«ریزش فوق‌العاده‌ای داره، خیلی راضیم.» — الهه ک.</p>`}</div>
<h2 class="sec">محصولات مشابه</h2><${Grid} ...${pr} wish=${wish} toggleW=${toggleW} add=${add} items=${P.filter(x=>x.id!=p.id&&(x.use==p.use||x.fab==p.fab)).slice(0,4)}/></div>`}
function Finder(pr){const Q=[['use','برای چه موقعیتی روسری می‌خواهی؟',FL[0][2]],['sea','برای کدام فصل می‌خواهی؟',FL[5][2]],['size','چه قواره‌ای را ترجیح می‌دهی؟',FL[1][2]],['fab','چه جنسی را دوست داری؟',['ابریشم','نخ','کرپ','ترمه','ساتن']],['col','چه رنگی را ترجیح می‌دهی؟',Object.keys(COL)]];

return h`<div class="w"><div class="fd"><h1>روسری مناسب خودت را پیدا کن</h1>${!done?h`<p style="margin-top:14px">سؤال ${fa(s+1)} از ${fa(Q.length)}</p><h3>${Q[s][1]}</h3><div class="op">${Q[s][2].map(o=>h`<button key=${o} onClick=${()=>{setA({...a,[Q[s][0]]:o});setS(s+1)}}>${o}</button>`)}</div>${s>0&&h`<a onClick=${()=>setS(s-1)}>→ قبلی</a>`}`:h`<p>پیشنهادهای ما برای تو:</p><div style="display:grid;gap:12px;margin:16px 0;text-align:right">${res.map(({p,why})=>h`<div class="ci" key=${p.id}><img src=${p.img} alt=""/><div style="flex:1"><a onClick=${()=>go('product-'+p.id)}><b style="color:var(--ch)">${p.name}</b></a><div>${T(p.price)}</div><small>${why.join(' · ')||'نزدیک‌ترین گزینه'}</small></div><button class="btn" onClick=${()=>pr.add(p.id,1)}>سبد</button></div>`)}</div><button class="btn o" onClick=${()=>{setS(0);setA({})}}>شروع دوباره</button>`}</div></div>`}
function Drawer({title,onClose,children}){return h`<div><div class="ov" onClick=${onClose}></div><aside class="dr"><div style="display:flex;justify-content:space-between"><h3>${title}</h3><button onClick=${onClose}><${Ic} d=${I.x}/></button></div>${children}</aside></div>`}
function App(){const[hs,setHs]=useState(location.hash.slice(1)||'home');const[cart,setCart]=useState(()=>ld('el-cart',{}));const[wish,setWish]=useState(()=>ld('el-wish',[]));const[dr,setDr]=useState(null);const[qv,setQv]=useState(null);const[q,setQ]=useState('');const[msg,setMsg]=useState('');
useEffect(()=>{const f=()=>{setHs(location.hash.slice(1)||'home');scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
useEffect(()=>{try{localStorage.setItem('el-cart',JSON.stringify(cart));localStorage.setItem('el-wish',JSON.stringify(wish))}catch(e){}},[cart,wish]);
const add=(id,n)=>{setCart(c=>({...c,[id]:(c[id]||0)+n}));setDr('cart')};const toggleW=id=>setWish(w=>w.includes(id)?w.filter(x=>x!=id):[...w,id]);

const MAP={'روزمره':['use','روزمره'],'رسمی':['use','رسمی'],'مجلسی':['use','مجلسی'],'ابریشم':['fab','ابریشم'],'ترمه':['fab','ترمه']};
let preF=null;if(route=='shop'&&hs.length>4){const raw=hs.slice(5);for(const k in MAP){if(encodeURIComponent(k).replace(/%/g,'')==raw)preF=MAP[k]}}
const ids=Object.keys(cart).filter(k=>cart[k]>0);const total=ids.reduce((s,k)=>s+cart[k]*P.find(p=>p.id==k).price,0);const cnt=ids.reduce((s,k)=>s+cart[k],0);
const pr={wish,toggleW,add,quick:setQv,q,setQ,pre:preF};
return h`<div><${Header} cart=${cnt} wish=${wish.length} route=${route} openCart=${()=>setDr('cart')} openWish=${()=>setDr('wish')} q=${q} setQ=${setQ}/>
${route=='shop'?h`<${Shop} ...${pr}/>`:route=='product'?h`<${Product} id=${hs.split('-')[1]} ...${pr}/>`:route=='finder'?h`<${Finder} ...${pr}/>`:h`<${Home} ...${pr}/>`}
<footer id="ft"><div class="w"><div><div class="logo">ÉLORA</div><p>زیبایی در ظرافت پوشش<br/>Modest Fashion · Scarf Collection</p></div><div><b style="color:#fff">درباره ما</b><p>برند ایرانی روسری و پوشش اسلامی با تمرکز بر کیفیت و ظرافت.</p></div><div><b style="color:#fff">راهنمای خرید</b><p>ارسال سریع، پرداخت امن و ضمانت بازگشت ۷ روزه.</p></div><div><b style="color:#fff">تماس با ما</b><p>info@elora.example · ۰۲۱-۱۲۳۴۵۶۷۸</p></div></div></footer>
${dr=='cart'&&h`<${Drawer} title="سبد خرید" onClose=${()=>setDr(null)}>${ids.length?h`${ids.map(k=>{const p=P.find(x=>x.id==k);return h`<div class="ci" key=${k}><img src=${p.img} alt=""/><div style="flex:1"><div style="color:var(--ch);font-size:14px">${p.name}</div><div>${T(p.price)}</div><div class="qty"><button onClick=${()=>setCart(c=>({...c,[k]:c[k]-1}))}>−</button><b>${fa(cart[k])}</b><button onClick=${()=>setCart(c=>({...c,[k]:c[k]+1}))}>+</button></div></div><button onClick=${()=>setCart(c=>({...c,[k]:0}))}><${Ic} d=${I.x} s=${16}/></button></div>`})}<b style="color:var(--ch)">مجموع: ${T(total)}</b><button class="btn" onClick=${()=>{setCart({});setDr(null);setMsg('سفارش شما ثبت شد (نمونه)')}}>ادامه خرید</button>`:h`<p>سبد خرید شما خالی است.</p>`}</${Drawer}>`}
${dr=='wish'&&h`<${Drawer} title="علاقه‌مندی‌ها" onClose=${()=>setDr(null)}>${wish.length?wish.map(id=>{const p=P.find(x=>x.id==id);return h`<div class="ci" key=${id}><img src=${p.img} alt=""/><div style="flex:1"><a onClick=${()=>{setDr(null);go('product-'+id)}}>${p.name}</a><div>${T(p.price)}</div></div><button class="btn" onClick=${()=>add(id,1)}>سبد</button><button onClick=${()=>toggleW(id)}><${Ic} d=${I.x} s=${16}/></button></div>`}):h`<p>هنوز چیزی اضافه نکرده‌اید.</p>`}</${Drawer}>`}

${msg&&h`<div class="ov" onClick=${()=>setMsg('')} style="display:grid;place-items:center"><div class="fd" style="margin:0">${msg}</div></div>`}</div>`}
ReactDOM.createRoot(document.getElementById('r')).render(h`<${App}/>`);
